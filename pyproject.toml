[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gridcast"
version = "0.1.0"
description = "Capture and evaluation harness for the NESO Carbon Intensity forecast"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "ruff>=0.6",
]

[project.scripts]
gridcast = "gridcast.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gridcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "network: exercises the live API; deselect with -m 'not network'",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["src/gridcast"]
