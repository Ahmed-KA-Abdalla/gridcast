name: capture

# Nominally hourly. GitHub queues scheduled workflows at low priority and drops
# them under load, and the delivered rate is a fraction of the nominal one: at a
# half-hourly cadence this repository received roughly 60% of its runs in the
# first week and under 10% in the second. Asking for less may deliver more,
# since a lower nominal rate is deprioritised less aggressively. The observed
# rate is recorded in docs/design.md.
#
# Missed runs cost forecast vintages but not outcomes, because each run
# re-harvests the past 24 hours. That redundancy exists for this reason.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Capture
        run: gridcast snapshot

      - name: Commit
        run: |
          if [ -z "$(git status --porcelain data/raw)" ]; then
            echo "nothing captured"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          git commit -m "capture: $(date -u +'%Y-%m-%dT%H:%MZ')"
          # A push made while a human push is landing is rejected outright.
          # Rebasing onto whatever arrived keeps the capture rather than losing
          # it to a race, which is what cost run #178.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          exit 1
