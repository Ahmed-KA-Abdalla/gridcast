name: page

# Rebuilds the evaluation page from the committed record and publishes it.
#
# Generated rather than written, because the findings move: the matched sample
# grows with every capture and the gate refits weekly. Two headline figures have
# already reversed as the sample grew, so a hand-written page would go stale
# without anyone noticing.
#
# Weekly, after the gate has run, so the page reflects the current verdict
# rather than the one before it.
on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Build the page
        run: gridcast report-page --out site/index.html

      # The README's figures go stale between runs, and this file has twice
      # quoted numbers a current run no longer produced. Only the region
      # between the markers is touched; the command fails rather than writing
      # if they are missing.
      - name: Refresh the README figures
        run: gridcast refresh-readme

      - name: Commit the refreshed figures
        run: |
          if [ -z "$(git status --porcelain README.md)" ]; then
            echo "figures unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "figures: $(date -u +'%Y-%m-%d')"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          exit 1

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
